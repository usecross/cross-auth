# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
inheritance: true

reviews:
  poem: false
  in_progress_fortune: false
  sequence_diagrams: false

  auto_review:
    base_branches: [".*"]

  pre_merge_checks:
    docstrings:
      mode: "off"

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
