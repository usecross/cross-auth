name: Examples E2E

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "examples/**"
      - "e2e/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/examples-e2e.yml"
  # Any base branch, so stacked PRs run these too.
  pull_request:
    paths:
      - "src/**"
      - "examples/**"
      - "e2e/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/examples-e2e.yml"

jobs:
  spa-fastapi-hybrid-e2e:
    name: SPA + FastAPI hybrid example
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Sync FastAPI example dependencies
        run: uv sync --frozen --package cross-auth-fastapi-example

      - name: Install SPA dependencies
        working-directory: examples/spa
        run: bun install --frozen-lockfile

      - name: Install E2E dependencies
        working-directory: e2e
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: e2e
        run: bunx playwright install --with-deps chromium

      - name: Run example end-to-end tests
        working-directory: e2e
        run: bun run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore

  framework-contract-e2e:
    name: Shared framework contract (Django + FastAPI)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      # Both examples share the workspace environment; --inexact keeps the
      # first example's dependencies while adding the second's.
      - name: Sync example dependencies
        run: |
          uv sync --frozen --package cross-auth-fastapi-example
          uv sync --frozen --inexact --package cross-auth-django-example

      - name: Install E2E dependencies
        working-directory: e2e
        run: bun install --frozen-lockfile

      - name: Typecheck E2E sources
        working-directory: e2e
        run: bun run typecheck

      - name: Install Playwright browser
        working-directory: e2e
        run: bunx playwright install --with-deps chromium

      # Starts the pinned Google emulator, then one server and database per
      # worker for each example app; no request leaves the runner.
      - name: Run shared framework contract
        working-directory: e2e
        run: bun run test:frameworks

      - name: Upload Playwright report and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-frameworks
          path: |
            e2e/playwright-report/frameworks
            e2e/test-results/frameworks
          if-no-files-found: ignore
